<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苔原信使</title>
  <link rel="stylesheet" href="game.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>苔原信使</h1>
      <p id="counter" role="status">种子 0 / 3</p>
    </header>
    <div class="stage">
      <canvas id="game" width="960" height="450" tabindex="-1" aria-label="苔原信使横版关卡" aria-describedby="controls">当前浏览器无法显示游戏画面。</canvas>
      <section id="pause" class="result" aria-labelledby="pause-title" hidden>
        <h2 id="pause-title">游戏已暂停</h2>
        <p>窗口失焦或页面隐藏时暂停，位置和种子进度已保留。</p>
        <button id="resume" type="button">继续游戏</button>
      </section>
      <section id="result" class="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <button id="retry" type="button">重试</button>
      </section>
    </div>
    <p id="controls">用 <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动，按 <kbd>空格</kbd> 或 <kbd>↑</kbd> 跳跃，按 <kbd>R</kbd> 重开。翻过断崖，到达山谷另一头的旗子。</p>
  </main>
</body>
</html>
