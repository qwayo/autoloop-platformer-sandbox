<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苔原信使</title>
  <link rel="stylesheet" href="game.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>苔原信使</h1>
      <p id="counter" role="status">种子 0 / 3</p>
      <div class="game-actions">
        <button id="restart-button" type="button">重新开始</button>
        <button id="pause-button" type="button" aria-controls="pause">暂停游戏</button>
      </div>
    </header>
    <div class="stage">
      <canvas id="game" width="960" height="450" tabindex="-1" aria-label="苔原信使横版关卡" aria-describedby="controls">当前浏览器无法显示游戏画面。</canvas>
      <section id="pause" class="result" aria-labelledby="pause-title" hidden>
        <h2 id="pause-title">游戏已暂停</h2>
        <p>位置和种子进度已保留，点击“继续游戏”恢复。</p>
        <button id="resume" type="button">继续游戏</button>
      </section>
      <section id="result" class="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <button id="retry" type="button">重试</button>
      </section>
    </div>
    <nav class="touch-controls" aria-label="触屏游戏操作">
      <div class="touch-directions">
        <button type="button" data-touch-action="left">向左</button>
        <button type="button" data-touch-action="right">向右</button>
      </div>
      <button type="button" data-touch-action="jump">跳跃</button>
    </nav>
    <p id="controls">触屏可按住下方按钮移动，同时点按跳跃。用 <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动，按 <kbd>空格</kbd> 或 <kbd>↑</kbd> 跳跃，游玩时点击“重新开始”或按 <kbd>R</kbd> 重开，回到出生点并清空种子进度。暂停期间不能重开。点击“暂停游戏”可主动暂停，点击“继续游戏”恢复；窗口失焦或页面隐藏时也会暂停。翻过断崖，到达山谷另一头的旗子。</p>
  </main>
</body>
</html>
